services:
  app:
    build: .
    image: livevote
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      # SQLite file on the mounted volume so data survives restarts.
      DATABASE_URL: file:/app/data/livevote.db
      # Required — compose fails to start if these are not set in .env (H8).
      # Use a hashed password (ADMIN_PASSWORD_HASH) in production; see DEPLOY.md.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (long random string)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
    volumes:
      - livevote-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

volumes:
  livevote-data:
